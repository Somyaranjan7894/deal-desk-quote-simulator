services:
  - type: web
    name: deal-desk-quote-simulator-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python run.py || uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_HOST
        value: "0.0.0.0"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://deal-desk-quote-simulator.vercel.app"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
